name: Release

# Push a tag like v1.0.1 and this builds the Windows installers and attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: npm ci
      - run: npm run build
      - run: npm run icons

      - name: Build installers (.exe and .msi)
        run: npx electron-builder --win nsis msi --publish never

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.msi
          generate_release_notes: true

      - name: Keep installers as a build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: NoteBase-installers
          path: |
            release/*.exe
            release/*.msi
