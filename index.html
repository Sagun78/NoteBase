<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoteBase</title>
  <meta name="application-name" content="NoteBase" />
  <meta name="theme-color" content="#2f6fe4" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
</head>
<body>
  <div id="app"></div>
  <div id="bubble" class="bubble" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="imgbar" class="imgbar" hidden></div>
  <input type="file" id="imgInput" accept="image/*" multiple hidden />
  <input type="file" id="fileInput" multiple hidden />
  <input type="file" id="mdInput" accept=".md,.markdown,.txt,.docx,.pdf,.html,.htm,.mhtml,.mht,.csv,.tsv,.eml,.textpack,.textbundle" multiple hidden />
  <script type="module" src="/src/main.js"></script>
</body>
</html>
